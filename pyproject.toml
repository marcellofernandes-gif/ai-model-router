[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-router"
version = "0.1.0"
description = "Escolhe o modelo Claude certo para cada função, sem perder qualidade."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ia = "model_router.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
model_router = ["rotas.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
